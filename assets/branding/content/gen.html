'use strict';
const C = {
  light: '#FAF9F6', dark: '#0F172A', accent: '#4F46E5',
  dText: '#1C1917', lText: '#F8FAFC', mute: '#94A3B8',
  border: '#E7E5E4', soft: '#57534E', frame: '#0B0F19'
};
const U = 'Unbounded, sans-serif';
const M = 'Manrope, sans-serif';
const E = '"Noto Color Emoji", "Noto Emoji", sans-serif';

function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fitFont(c, text, size, maxW, family) {
  let s = size;
  c.font = '800 ' + s + 'px ' + family;
  while (s > 30 && c.measureText(text).width > maxW) { s -= 2; c.font = '800 ' + s + 'px ' + family; }
  return s;
}
function wrapText(c, text, size, maxW, family) {
  c.font = '500 ' + size + 'px ' + family;
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (cur && c.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function indicator(ctx, W, H, i, n) {
  ctx.fillStyle = C.mute;
  ctx.font = '600 24px ' + M;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(String(i).padStart(2, '0') + ' / ' + String(n).padStart(2, '0'), W - 80, H - 80);
}
// ============ ЗНАК (оригинальный mark из проекта, монохромный) ============
let markImg = null, markWhite = null;
// белая версия знака (для тёмных фонов): сохраняем альфу, цвет -> белый
// + индиго-шеврон #4F46E5 поверх (пиксели оригинального mark где (blue - red) > 20)
function makeWhite(img) {
  const c = mk(img.naturalWidth, img.naturalHeight);
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  const orig = x.getImageData(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = '#FFFFFF';
  x.fillRect(0, 0, c.width, c.height);
  const data = x.getImageData(0, 0, c.width, c.height).data;
  for (let i = 0; i < data.length; i += 4) {
    const r = orig.data[i], g = orig.data[i + 1], b = orig.data[i + 2], a = orig.data[i + 3];
    if (a > 0 && (b - r) > 20) {
      data[i] = 0x4F; data[i + 1] = 0x46; data[i + 2] = 0xE5; data[i + 3] = a;
    }
  }
  x.putImageData(new ImageData(data, c.width, c.height), 0, 0);
  return c;
}
// знак по центру квадрата size×size (глиф ≈78% кадра, как в оригинале)
function drawSign(ctx, cx, cy, size) {
  const img = markWhite || markImg;
  if (!img) return;
  ctx.drawImage(img, cx - size / 2, cy - size / 2, size, size);
}
// ============ ОБЩИЕ ============
function browserFrame(ctx, img, x, y, w, h) {
  ctx.fillStyle = C.frame;
  rr(ctx, x, y, w, h, 20); ctx.fill();
  const dots = ['#FF5F57', '#FEBC2E', '#28C840'];
  dots.forEach((col, i) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x + 36 + i * 26, y + 30, 8, 0, Math.PI * 2); ctx.fill(); });
  const pad = 16, top = 56;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const iw2 = w - pad * 2, ih2 = h - top - pad;
  const s = Math.min(iw2 / iw, ih2 / ih);
  const dw = iw * s, dh = ih * s;
  ctx.drawImage(img, x + pad + (iw2 - dw) / 2, y + top + (ih2 - dh) / 2, dw, dh);
}
function ctaButton(ctx, cx, cy, w, h, label, size) {
  ctx.fillStyle = C.accent;
  rr(ctx, cx - w / 2, cy - h / 2, w, h, 40); ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '700 ' + size + 'px ' + M;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, cx, cy + 2);
}
function darkCover(c, title, sub, i, n, markSize) {
  const ctx = c.getContext('2d');
  ctx.fillStyle = C.dark; ctx.fillRect(0, 0, c.width, c.height);
  drawSign(ctx, c.width / 2, 330 + markSize / 2, markSize);
  const ts = fitFont(ctx, title, 120, c.width - 160, U);
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '800 ' + ts + 'px ' + U;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(title, c.width / 2, 870);
  ctx.fillStyle = C.mute;
  ctx.font = '600 32px ' + M;
  ctx.fillText(sub, c.width / 2, 985);
  indicator(ctx, c.width, c.height, i, n);
}
function lightCase(c, img, title, metric, i, n) {
  const ctx = c.getContext('2d');
  ctx.fillStyle = C.light; ctx.fillRect(0, 0, c.width, c.height);
  browserFrame(ctx, img, 140, 150, 800, 600);
  const ts = fitFont(ctx, title, 64, c.width - 160, U);
  ctx.fillStyle = C.dText;
  ctx.font = '800 ' + ts + 'px ' + U;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(title, c.width / 2, 890);
  ctx.fillStyle = C.accent;
  ctx.font = '700 36px ' + M;
  ctx.fillText(metric, c.width / 2, 990);
  indicator(ctx, c.width, c.height, i, n);
}
function lightCta(c, title, sub, btnLabel) {
  const ctx = c.getContext('2d');
  ctx.fillStyle = C.dark; ctx.fillRect(0, 0, c.width, c.height);
  const ms = 256;
  drawSign(ctx, c.width / 2, 300 + ms / 2, ms);
  const ts = fitFont(ctx, title, 80, c.width - 160, U);
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '800 ' + ts + 'px ' + U;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(title, c.width / 2, 780);
  ctx.fillStyle = C.mute;
  ctx.font = '600 32px ' + M;
  ctx.fillText(sub, c.width / 2, 880);
  ctaButton(ctx, c.width / 2, 990, 280, 80, btnLabel, 28);
}
function priceSlide(c, price, name, items, i, n) {
  const ctx = c.getContext('2d');
  ctx.fillStyle = C.light; ctx.fillRect(0, 0, c.width, c.height);
  const ps = fitFont(ctx, price, 180, c.width - 120, U);
  ctx.fillStyle = C.accent;
  ctx.font = '800 ' + ps + 'px ' + U;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(price, c.width / 2, 430);
  const ns = fitFont(ctx, name, 64, c.width - 160, U);
  ctx.fillStyle = C.dText;
  ctx.font = '700 ' + ns + 'px ' + U;
  ctx.fillText(name, c.width / 2, 680);
  ctx.fillStyle = C.dText;
  ctx.font = '500 28px ' + M;
  ctx.textAlign = 'center';
  let y = 830;
  for (const it of items) { ctx.fillText(it, c.width / 2, y); y += 56; }
  indicator(ctx, c.width, c.height, i, n);
}
function processSlide(c, emoji, title, desc, i, n) {
  const ctx = c.getContext('2d');
  ctx.fillStyle = C.light; ctx.fillRect(0, 0, c.width, c.height);
  ctx.font = '96px ' + E;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emoji, c.width / 2, 360);
  const ts = fitFont(ctx, title, 64, c.width - 160, U);
  ctx.fillStyle = C.dText;
  ctx.font = '700 ' + ts + 'px ' + U;
  ctx.fillText(title, c.width / 2, 550);
  const lines = wrapText(ctx, desc, 32, c.width - 200, M);
  ctx.fillStyle = C.soft;
  ctx.font = '500 32px ' + M;
  let y = 690;
  for (const l of lines) { ctx.fillText(l, c.width / 2, y); y += 52; }
  indicator(ctx, c.width, c.height, i, n);
}
function faqSlide(c, q, a, i, n) {
  const ctx = c.getContext('2d');
  ctx.fillStyle = C.light; ctx.fillRect(0, 0, c.width, c.height);
  const qs = fitFont(ctx, q, 56, c.width - 160, U);
  ctx.fillStyle = C.dText;
  ctx.font = '700 ' + qs + 'px ' + U;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(q, c.width / 2, 430);
  const lines = wrapText(ctx, a, 32, c.width - 200, M);
  ctx.fillStyle = C.soft;
  ctx.font = '500 32px ' + M;
  let y = 600;
  for (const l of lines) { ctx.fillText(l, c.width / 2, y); y += 54; }
  indicator(ctx, c.width, c.height, i, n);
}
function postTitle(ctx, title, y, size, color, weight) {
  const ts = fitFont(ctx, title, size, 920, U);
  ctx.fillStyle = color || C.dText;
  ctx.font = (weight || 800) + ' ' + ts + 'px ' + U;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(title, ctx.canvas.width / 2, y);
}
function postBody(ctx, text, y, size, color, maxW) {
  const lines = wrapText(ctx, text, size, maxW || 880, M);
  ctx.fillStyle = color || C.dText;
  ctx.font = '500 ' + size + 'px ' + M;
  ctx.textAlign = 'center';
  let yy = y;
  for (const l of lines) { ctx.fillText(l, ctx.canvas.width / 2, yy); yy += size * 1.5; }
  return yy;
}
function wireframe(c, x, y, w, h) {
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#FFFFFF';
  rr(ctx, x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = C.border; ctx.lineWidth = 3;
  rr(ctx, x, y, w, h, 16); ctx.stroke();
  const blocks = [
    [x + 40, y + 40, w - 80, 90],
    [x + 40, y + 150, (w - 120) * 0.6, 130],
    [x + 40 + (w - 120) * 0.6 + 40, y + 150, (w - 120) * 0.4, 130],
    [x + 40, y + 300, (w - 120) / 2, 120],
    [x + 40 + (w - 120) / 2 + 40, y + 300, (w - 120) / 2, 120],
    [x + 40, y + 440, (w - 120) / 3, 100],
    [x + 40 + (w - 120) / 3 + 30, y + 440, (w - 120) / 3, 100],
    [x + 40 + 2 * ((w - 120) / 3 + 30), y + 440, (w - 120) / 3, 100],
  ];
  blocks.forEach((b) => {
    ctx.fillStyle = '#F5F5F4';
    rr(ctx, b[0], b[1], b[2], b[3], 10); ctx.fill();
    ctx.strokeStyle = C.border;
    rr(ctx, b[0], b[1], b[2], b[3], 10); ctx.stroke();
  });
}
function grayBox(ctx, x, y, w, h, label) {
  ctx.fillStyle = C.border;
  rr(ctx, x, y, w, h, 16); ctx.fill();
  ctx.fillStyle = '#A8A29E';
  ctx.font = '600 28px ' + M;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label || 'Скриншот', x + w / 2, y + h / 2);
}

// ============ ЗАГРУЗКА АССЕТОВ ============
async function loadAll() {
  const names = ['cafe', 'barber', 'furniture'];
  const srcs = { cafe: '/s/cafe.webp', barber: '/s/barbershop.webp', furniture: '/s/furniture.webp' };
  const out = {};
  for (const n of names) {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = srcs[n]; });
    out[n] = img;
  }
  markImg = new Image();
  await new Promise((res, rej) => { markImg.onload = res; markImg.onerror = rej; markImg.src = '/l/dark2-512.png'; });
  markWhite = makeWhite(markImg);
  return out;
}

window.__genAll = async () => {

  try {
    await document.fonts.load('800 32px Unbounded', 'Ж');
    await document.fonts.load('600 32px Manrope', 'Ж');
  } catch (e) { checks.push('fonts.load failed: ' + e.message); }
  const unb = document.fonts.check('800 32px Unbounded', 'Ж');
  const man = document.fonts.check('600 32px Manrope', 'Ж');
  if (!unb) checks.push('Unbounded кириллица не загрузилась');
  if (!man) checks.push('Manrope кириллица не загрузилась');
